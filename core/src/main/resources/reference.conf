# Settings for the AWS Batch interface.
tasks.elastic.batch {

      # aws region e.g. us-east-1
      # leave empty for using the default region chain
      region = ""

      # Batch queue where the main job of the app runs,
      # submitted once by Bootstrap when the app is launched from outside
      # AWS. Not used for scheduling worker nodes.
      jobQueue = ""

      # Worker queues, listed by name or ARN. Autodiscovers capacity, instances, 
      # spot.
      #
      # Routing:
      #   - GPU requests go only to GPU-capable queues.
      #   - Non-GPU requests go to on-demand queues while they still have
      #     aggregate vCPU headroom, otherwise to spot queues.
      #   - Among candidates, the queue whose largest instance is smallest
      #     (yet still fits) wins (tight fit).
      #
      # Example:
      #   queues = ["cpu-small","cpu-big","spot-any","gpu-small"]
      queues = []

      # AWS Batch job definition name or ARN. Used for requests that do not
      # ask for a specific image (ResourceRequest.image is None); the job
      # definition must have a container image configured.
      jobDefinition = ""

      # Mapping from ResourceRequest.image to AWS Batch job definition
      # name/ARN. Each entry pins one image string to a pre-registered job
      # definition whose container uses that image. A request whose image
      # is not present in this list fails fast (no worker is spawned) —
      # AWS Batch requires the image to come from the job definition, so
      # runtime image switching is not possible without a matching entry.
      # Requests with image = None fall back to jobDefinition above.
      #
      # Example:
      #   jobDefinitionsByImage = [
      #     { image = "my-image:v1", jobDefinition = "my-jd-v1" }
      #   ]
      jobDefinitionsByImage = []

      # Minimum vCPUs to request per job
      minimumCpu = 1

      # Minimum memory (MiB) to request per job
      minimumMemory = 512

      # CloudWatch Logs log group for Batch job output
      logGroup = "/aws/batch/job"

      # Tags as flat list of key-value pairs: ["key1", "value1", "key2", "value2"]
      tags = []

}

# Settings for the standalone Amazon ECS elastic backend (tasks-ecs module).
#
# Independent of tasks.elastic.batch: this backend never falls back to AWS
# Batch, and the AWS Batch backend never reads this block. An application
# picks exactly one elastic backend (EcsElasticSupport vs BatchElasticSupport
# vs ...), they are not composed.
#
# Worker tasks are run with a capacityProviderStrategy against
# tasks.elastic.ecs.capacityProvider, e.g. an Amazon ECS Managed Instances
# capacity provider. This backend does not create that capacity provider, its
# Auto Scaling group / launch template, or its Managed Instances provider
# configuration — all of that must already exist and already be associated
# with the cluster (via Terraform/CDK/console) before startup. Amazon ECS
# itself scales that pool up and down as tasks are placed; this backend only
# calls RunTask / StopTask against it.
#
# Every task definition referenced below must be compatible with the EC2
# launch type (what both Auto Scaling group capacity providers and ECS
# Managed Instances run under) and use the bridge, host or none network mode;
# awsvpc is not supported since this backend never sets networkConfiguration.
tasks.elastic.ecs {

      # aws region e.g. us-east-1
      # Empty = fall back to the standard AWS default region chain (AWS_REGION
      # env var, profile, IMDS), resolved once at startup. If nothing resolves,
      # startup fails with an explicit error rather than deferring the failure
      # to the worker.
      #
      # The resolved region is also injected into the worker container as
      # AWS_REGION and AWS_DEFAULT_REGION. Entries in `environment` below
      # override this, so a worker can be pointed at a different region than
      # the cluster.
      region = ""

      # ECS cluster name or ARN. Required.
      cluster = ""

      # Name of the capacity provider to run worker tasks on, e.g. an Amazon
      # ECS Managed Instances capacity provider. Must already exist and
      # already be associated with `cluster` — this backend only references
      # it by name in RunTask's capacityProviderStrategy, it never creates or
      # associates capacity providers itself. Required.
      capacityProvider = ""

      # base/weight of the single-entry capacityProviderStrategy passed to
      # RunTask. See the ECS API reference for CapacityProviderStrategyItem.
      capacityProviderBase = 0
      capacityProviderWeight = 1

      # Name of the container inside the task definition whose command is
      # overridden with the worker bootstrap script. Must match the container
      # name in the task definition exactly. Required.
      containerName = "worker"

      # Task definition family, family:revision or ARN. Used for requests that
      # do not ask for a specific image (ResourceRequest.image is None).
      taskDefinition = ""

      # Mapping from ResourceRequest.image to ECS task definition. ECS takes
      # the image from the task definition, so it cannot be overridden at
      # RunTask time — a request whose image is not listed here fails fast
      # without spawning a worker. Requests with image = None fall back to
      # taskDefinition above.
      #
      # Example:
      #   taskDefinitionsByImage = [
      #     { image = "my-image:v1", taskDefinition = "my-td-v1" }
      #   ]
      taskDefinitionsByImage = []

      # Minimum vCPUs to request per worker task. Converted to ECS CPU units
      # (1 vCPU = 1024 units) when the task is placed.
      minimumCpu = 1

      # Minimum memory (MiB) to request per worker task
      minimumMemory = 512

      # RunTask startedBy value, used to identify tasks started by this
      # framework. At most 36 characters.
      startedBy = "tasks-elastic"

      # Reason recorded on StopTask calls
      stopReason = "Shut down by tasks framework"

      # Extra environment variables injected into the worker container, as a
      # flat list of alternating keys and values. The region above is added
      # automatically and does not need to be repeated here.
      environment = []

      # Tags as flat list of key-value pairs: ["key1", "value1", "key2", "value2"]
      tags = []

}

