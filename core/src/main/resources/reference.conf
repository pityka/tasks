# Hard cap on total active metric series. Bounds AMP/Prometheus ingest cost
# regardless of caller behavior. The library derives a per-instrument cap on
# distinct (task.id, task.version) pairs from this. Overflow pairs fold into
# the sentinel value "_other" with a single WARN log. Has no effect when the
# caller passes MeterProvider.noop.
tasks.otel.maxSeries = 5000

