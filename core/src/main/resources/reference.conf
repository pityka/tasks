

###################
# Task framework  #
###################

# hosts.port = 28888

# picks an arbitrary unused port if the one in hosts.port is already taken
# For networks where all ports are visible this would work
# For networks which preconfigure which ports are visible this will not work
# If this is setting is false and hosts.port is already taken then an exception is thrown
hosts.mayUseArbitraryPort = true
hosts.mayUseArbitraryPort = ${?HOSTS_MAYUSEARBITRARYPORT}

# host image if any
hosts.image = ${?HOSTS_IMAGE}

# labels advertised by this host. Tasks whose ResourceRequest.nodeSelector
# evaluates to true against these labels are eligible to run here. Used to
# express node affinity (Has) and avoidance (Not(Has)). opaque
# strings
hosts.labels = []

# additional labels supplied as a single comma-separated string. Concatenated
# with hosts.labels at startup.
hosts.labelsAsCommaString = ""
hosts.labelsAsCommaString = ${?HOSTS_LABELSASCOMMASTRING}

# number of available CPU's on the current machine
hosts.numCPU = 1
hosts.numCPU = ${?HOSTS_NUMCPU}

# list of gpus
hosts.gpus = []

# list of gpus, as integers separated by comma
# for use of command line specification
# will be concatenated to hosts.gpus
hosts.gpusAsCommaString = ""
hosts.gpusAsCommaString = ${?HOSTS_GPUSASCOMMASTRING}

# number of available ram on the current machine in Mb
hosts.RAM = 96000
hosts.RAM = ${?HOSTS_RAM}

# available scratch space on the current machine in Mb
hosts.scratch = 1000000
hosts.scratch = ${?HOSTS_SCRATCH}

# number of CPU's reserved for purposes other than Tasks
hosts.reservedCPU = 0

# hostname of the current machine.
hosts.hostname = "localhost"
hosts.hostname = ${?HOSTS_HOSTNAME}

hosts.hostnameExternal = ${?HOSTS_HOSTNAMEEXTERNAL}

hosts.app = true
hosts.app = ${?HOSTS_APP}

# Address of the master this process should register with, host:port. Its
# absence (the default) is what makes HostConfigurationFromConfig.myRoles
# resolve to App/Queue instead of Worker -- only ever set this for a worker.
hosts.master = ${?HOSTS_MASTER}
hosts.masterprefix = ${?HOSTS_MASTERPREFIX}

# !Important!
tasks.fileservice.storageURI = "./"
tasks.fileservice.storageURI = ${?TASKS_FILESERVICE_STORAGEURI}

# if true the local storage will be proxied to remotes
tasks.fileservice.proxyStorage = false

# Turns on the http client
tasks.fileservice.remote.http = false

# Turns on the s3 client. It is also turned on if the storageURI has an s3 scheme.
tasks.fileservice.remote.s3 = false

# Keep track of the progress or not?
tasks.cache.enabled = true

# How to locate cache files
# Possible values are
# - "prefix" in which case it follows
#   the same prefix what is used to create regular files
# - a relative path separated by '/' in which case all cache meta files are
#   placed in that folder, relative to the storage root.
tasks.cache.sharefilecache.path = prefix

# Timeout after which to give up waiting to persist results into the cache
tasks.cache.timeout = 10 minutes

# Parallelism of the check whether a file handle in the cache is accessible
# This many file handles are concurrently checked
tasks.cache.accessibility-check-parallelism = 32

# Cache checks whether a file is still accessible. If not treats it as no hit.
tasks.verifySharedFileInCache = true

# !Important!
# Resubmit failed tasks for execution.
# Leads to infinite loop if failure is systematic.
tasks.resubmitFailedTask = false

# Ping interval between worker and queue.
tasks.askInterval = 500 ms

# Poll interval used by state-based rendezvous while waiting for peers to join.
tasks.rendezvousPollInterval = 500 ms

# How long a worker waits for the queue's reply to AskForWork. The reply
# payload includes the task's inline input bytes, so this needs to be
# large enough to cover serialization + transfer for the biggest expected
# inline input.
tasks.queue.askForWorkTimeout = 10 minutes

# HTTP timeouts used by the inter-node messenger.
# serverIdleTimeout: how long ember-server keeps a connection open with
#   no traffic; needs to exceed the time taken to push the largest
#   expected inline message body through.
# serverRequestHeaderReceiveTimeout: ember-server's grace period for
#   reading the request line + headers.
# clientTimeout: ember-client per-request timeout.
# clientIdleConnectionTime: how long ember-client keeps pooled
#   connections idle before discarding. Must be strictly less than
#   serverIdleTimeout so the client discards a pooled connection
#   before the peer's server has a chance to close it underneath us;
#   otherwise the next write to a server-closed socket surfaces as
#   "Connection reset".
tasks.remoteMessenger.serverIdleTimeout = 30 minutes
tasks.remoteMessenger.serverRequestHeaderReceiveTimeout = 60 seconds
tasks.remoteMessenger.clientTimeout = 30 minutes
tasks.remoteMessenger.clientIdleConnectionTime = 25 minutes

tasks.disableRemoting = true
tasks.disableRemoting = ${?TASKS_DISABLEREMOTING}

tasks.skipContentHashVerificationAfterCache = false
tasks.skipContentHashCreationUponImport = false

tasks.s3.regionProfileName = "default"

tasks.s3.serverSideEncryption = "AES256"

tasks.s3.cannedAcls = []

tasks.s3.grantFullControl = []

tasks.s3.uploadParallelism = 4

tasks.s3.uploadPartSizeMB = 20

tasks.s3.downloadParallelism = 64

tasks.s3.downloadPartSizeMB = 16

tasks.s3.multipartThreshold = 67108864

tasks.s3.retryMaxAttempts = 10

tasks.elastic.nodename = ""
tasks.elastic.nodename = ${?TASKS_ELASTIC_NODENAME}

# Kill a node if it is idle after x time.
tasks.elastic.idleNodeTimeout = 900 s

# Max nodes to spawn at a given instant
tasks.elastic.maxNodes = 1

# Max nodes to spawn, cumulative from start of application
tasks.elastic.maxNodesCumulative = 10

# Max pending nodes. After this is reached no new node request is submitted.
tasks.elastic.maxPending = ${tasks.elastic.maxNodes}

# Time to wait for a pending node to come online.
# The request is removed after this time if the node is still not online.
tasks.elastic.pendingNodeTimeout = 900 s

tasks.elastic.logQueueStatus = true

# The jvmMaxHeapFactor * requestedMemOfNewNode is assigned to -Xmx
tasks.elastic.jvmMaxHeapFactor = 0.85

tasks.fileSendChunkSize = 16 MiB

tasks.elastic.javaCommandLine = ""

tasks.elastic.checktempfolder = false

# Path inside the worker container where the messenger's base URL is
# written at startup. A container-level health check can read it to
# locate the worker's `/health` endpoint:
#   curl -fsS "$(cat /var/run/tasks-worker.url)/health" || exit 1
# The endpoint returns 200 when the worker has the self-shutdown path
# wired (node + elasticSupport present) and 503 once the launcher has
# committed to idle self-shutdown. Worker startup fails if a non-empty
# path is configured but the file cannot be written. Set to "" or "-"
# (the default) to disable writing the file.
tasks.worker.healthUrlFile = ""
tasks.worker.healthUrlFile = ${?TASKS_WORKER_HEALTHURLFILE}

tasks.elastic.workerWorkingDirectory = """./"""

tasks.elastic.workerPackageName = "package"


# Interval at which each launcher bumps its liveness counter in the queue
# state. This is the only unconditional writer at idle -- every other
# periodic operation leaves the state unchanged and so costs a read rather
# than a write against a remote queue state backend. Detection of a crashed
# launcher lags by roughly this interval, which is still far tighter than
# tasks.elastic.idleNodeTimeout.
tasks.failuredetector {

	heartbeat-interval = 30 s
	heartbeat-interval = ${?TASKS_FAILUREDETECTOR_HEARTBEATINTERVAL}

}

tasks.codeVersion = undefined

tasks.addShutdownHook = true

# Hard cap on total active metric series. Bounds AMP/Prometheus ingest cost
# regardless of caller behavior. The library derives a per-instrument cap on
# distinct (task.id, task.version) pairs from this. Overflow pairs fold into
# the sentinel value "_other" with a single WARN log. Has no effect when the
# caller passes MeterProvider.noop.
tasks.otel.maxSeries = 5000

tasks.worker-main-class = ""

tasks.createFilePrefixForTaskId = true

tasks.fileservice.allowDeletion = false

tasks.fileservice.allowOverwrite = false

tasks.fileservice.folderFileStorageCompleteFileCheck = true

tasks.maxConfigLoadInterval = 10 seconds

tasks.queue.trackDataFlow = false

tasks.queue.track-data-flow-history-file-read-parallelism = 32

tasks.fileservice.writeFileHistories = false

# force worker nodes to connect to a proxy file storage
tasks.fileservice.connectToProxy = false
tasks.fileservice.connectToProxy = ${?TASKS_FILESERVICE_CONNECTTOPROXY}

######################
# Task subsystem end #
######################
